kind = "web"
previewPath = "/"
title = "Viral Magic OS"
version = "1.0.0"
id = "artifacts/command-center"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23748

[services.development]
run = "pnpm --filter @workspace/command-center run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/command-center", "run", "build" ]
serve = "static"
publicDir = "artifacts/command-center/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23748"
BASE_PATH = "/"
