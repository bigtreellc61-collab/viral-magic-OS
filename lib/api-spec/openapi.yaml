components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        fullName:
          type: string
        roleName:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - fullName
        - roleName
        - createdAt
    SetupStatus:
      type: object
      properties:
        needsSetup:
          type: boolean
      required:
        - needsSetup
    SetupInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 10
        fullName:
          type: string
          minLength: 1
      required:
        - email
        - password
        - fullName
    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        rememberMe:
          type: boolean
      required:
        - email
        - password
    AccountUpdate:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
      required:
        - fullName
    PasswordChangeInput:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 10
      required:
        - currentPassword
        - newPassword
    AppSettings:
      type: object
      properties:
        businessName:
          type: ["string", "null"]
        ownerName:
          type: ["string", "null"]
        businessEmail:
          type: ["string", "null"]
        businessPhone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        defaultCurrency:
          type: string
        defaultTimezone:
          type: string
        appName:
          type: string
        appSubtitle:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        primaryAccentColor:
          type: string
        secondaryAccentColor:
          type: string
        defaultProjectStatus:
          type: string
        defaultTaskPriority:
          type: string
        defaultEstimatedTimelineDays:
          type: integer
        defaultProjectOwnerName:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time
      required:
        - defaultCurrency
        - defaultTimezone
        - appName
        - primaryAccentColor
        - secondaryAccentColor
        - defaultProjectStatus
        - defaultTaskPriority
        - defaultEstimatedTimelineDays
        - updatedAt
    AppSettingsUpdate:
      type: object
      properties:
        businessName:
          type: ["string", "null"]
        ownerName:
          type: ["string", "null"]
        businessEmail:
          type: ["string", "null"]
        businessPhone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        defaultCurrency:
          type: string
        defaultTimezone:
          type: string
        appName:
          type: string
          minLength: 1
        appSubtitle:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
