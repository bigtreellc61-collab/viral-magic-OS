openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Administrator authentication and first-run setup
  - name: settings
    description: Application-wide settings
  - name: activity
    description: Activity log
  - name: dashboard
    description: Foundation status dashboard
  - name: clients
    description: Client management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/setup-status:
    get:
      operationId: getSetupStatus
      tags: [auth]
      summary: Check whether first-run administrator setup is needed
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /auth/setup:
    post:
      operationId: completeSetup
      tags: [auth]
      summary: Create the first Administrator account (only while no users exist)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInput"
      responses:
        "201":
          description: Administrator account created and session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "409":
          description: Setup has already been completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out and destroy the current session
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated administrator
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/account:
    patch:
      operationId: updateAccount
      tags: [auth]
      summary: Update the authenticated administrator's display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the authenticated administrator's password
      description: Invalidates all other active sessions for this account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "204":
          description: Password changed
        "400":
          description: Current password incorrect or new password invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get application settings
      responses:
        "200":
          description: Application settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update application settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: Updated application settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List recent activity records
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Recent activity records, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/foundation:
    get:
      operationId: getFoundationStatus
      tags: [dashboard]
      summary: Get Phase 1A foundation status for the dashboard
      responses:
        "200":
          description: Foundation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationStatus"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/clients:
    get:
      operationId: getClientMetrics
      tags: [dashboard]
      summary: Get client metrics for the dashboard
      responses:
        "200":
          description: Client metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientMetrics"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients with search, filter, sort, and pagination
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: industry
          in: query
          required: false
          schema:
            type: string
        - name: businessType
          in: query
          required: false
          schema:
            type: string
        - name: customerMarket
          in: query
          required: false
          schema:
            type: string
        - name: showArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [newest, oldest, company_az, company_za, contact_az, recently_updated]
            default: newest
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Paginated client list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientListResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientBody"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/check-duplicate:
    post:
      operationId: checkClientDuplicate
      tags: [clients]
      summary: Check for potential duplicate clients before creating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientDuplicateCheckBody"
      responses:
        "200":
          description: Duplicate check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDuplicateCheckResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{clientId}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a single client by ID
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Client record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client record
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientBody"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Permanently delete an archived client and all their notes
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Client permanently deleted
        "400":
          description: Client must be archived before permanent deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{clientId}/archive:
    post:
      operationId: archiveClient
      tags: [clients]
      summary: Archive a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Archived client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{clientId}/restore:
    post:
      operationId: restoreClient
      tags: [clients]
      summary: Restore an archived client with a new status
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreClientBody"
      responses:
        "200":
          description: Restored client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{clientId}/notes:
    get:
      operationId: listClientNotes
      tags: [clients]
      summary: List notes for a client (pinned first, then newest)
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
        - name: showArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Client notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientNoteRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createClientNote
      tags: [clients]
      summary: Add a note to a client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientNoteBody"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientNoteRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{clientId}/notes/{noteId}:
    patch:
      operationId: updateClientNote
      tags: [clients]
      summary: Update a client note
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientNoteBody"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientNoteRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteClientNote
      tags: [clients]
      summary: Permanently delete an archived note
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Note permanently deleted
        "400":
          description: Note must be archived before permanent deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{clientId}/notes/{noteId}/pin:
    post:
      operationId: toggleClientNotePin
      tags: [clients]
      summary: Pin or unpin a client note
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleNotePinBody"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientNoteRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{clientId}/notes/{noteId}/archive:
    post:
      operationId: archiveClientNote
      tags: [clients]
      summary: Archive a client note
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Archived note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientNoteRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{clientId}/notes/{noteId}/restore:
    post:
      operationId: restoreClientNote
      tags: [clients]
      summary: Restore an archived client note
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Restored note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientNoteRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{clientId}/activity:
    get:
      operationId: listClientActivity
      tags: [clients]
      summary: List activity records for a specific client
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Client activity records, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityRecord"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        fullName:
          type: string
        roleName:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - fullName
        - roleName
        - createdAt
    SetupStatus:
      type: object
      properties:
        needsSetup:
          type: boolean
      required:
        - needsSetup
    SetupInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 10
        fullName:
          type: string
          minLength: 1
      required:
        - email
        - password
        - fullName
    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        rememberMe:
          type: boolean
      required:
        - email
        - password
    AccountUpdate:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
      required:
        - fullName
    PasswordChangeInput:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 10
      required:
        - currentPassword
        - newPassword
    AppSettings:
      type: object
      properties:
        businessName:
          type: ["string", "null"]
        ownerName:
          type: ["string", "null"]
        businessEmail:
          type: ["string", "null"]
        businessPhone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        defaultCurrency:
          type: string
        defaultTimezone:
          type: string
        appName:
          type: string
        appSubtitle:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        primaryAccentColor:
          type: string
        secondaryAccentColor:
          type: string
        defaultProjectStatus:
          type: string
        defaultTaskPriority:
          type: string
        defaultEstimatedTimelineDays:
          type: integer
        defaultProjectOwnerName:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time
      required:
        - defaultCurrency
        - defaultTimezone
        - appName
        - primaryAccentColor
        - secondaryAccentColor
        - defaultProjectStatus
        - defaultTaskPriority
        - defaultEstimatedTimelineDays
        - updatedAt
    AppSettingsUpdate:
      type: object
      properties:
        businessName:
          type: ["string", "null"]
        ownerName:
          type: ["string", "null"]
        businessEmail:
          type: ["string", "null"]
        businessPhone:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        defaultCurrency:
          type: string
        defaultTimezone:
          type: string
        appName:
          type: string
          minLength: 1
        appSubtitle:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        primaryAccentColor:
          type: string
        secondaryAccentColor:
          type: string
        defaultProjectStatus:
          type: string
        defaultTaskPriority:
          type: string
        defaultEstimatedTimelineDays:
          type: integer
        defaultProjectOwnerName:
          type: ["string", "null"]
    ActivityRecord:
      type: object
      properties:
        id:
          type: string
        activityType:
          type: string
        actorName:
          type: ["string", "null"]
        description:
          type: string
        entityType:
          type: ["string", "null"]
        entityId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - activityType
        - description
        - createdAt
    FoundationStatus:
      type: object
      properties:
        databaseConnected:
          type: boolean
        authConfigured:
          type: boolean
        adminAccountExists:
          type: boolean
        settingsConfigured:
          type: boolean
        appVersion:
          type: string
        phase:
          type: string
        generatedAt:
          type: string
          format: date-time
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityRecord"
      required:
        - databaseConnected
        - authConfigured
        - adminAccountExists
        - settingsConfigured
        - appVersion
        - phase
        - generatedAt
        - recentActivity
